# IMU-Visual Fusion motion model configuration
# This motion model combines IMU integration with visual odometry for robust pose estimation.
# 
# Fusion Strategy:
# - IMU provides high-rate, drift-prone predictions
# - Visual provides lower-rate, drift-free corrections
# - Weighted fusion balances both modalities

type: IMUVisualFusion
args:
  # Gravity constant (m/s^2) - adjust based on dataset location
  # Default: 9.81 (Earth standard gravity)
  gravity: 9.81
  
  # Device for computation ('cpu' or 'cuda' or 'cuda:0', etc.)
  device: cpu
  
  # Weight for IMU prediction in fusion (0.0 to 1.0)
  # Higher values trust IMU more, lower values trust visual more
  # Recommended: 0.2-0.4 for typical indoor/outdoor scenarios
  imu_weight: 0.3
  
  # Weight for visual prediction in fusion (0.0 to 1.0)
  # Should sum to 1.0 with imu_weight for proper normalization
  # Recommended: 0.6-0.8 for typical indoor/outdoor scenarios
  visual_weight: 0.7
  
  # Scaling factor for estimating forward (Z-axis) motion from lateral flow cues
  # Higher values increase forward translation magnitude inferred from optical flow
  forward_scale: 0.5
  
  # Enable visual odometry component
  # Set to false to use IMU-only mode
  use_visual: true
