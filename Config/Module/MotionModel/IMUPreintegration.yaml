# IMU Preintegration Motion Model Configuration
# This motion model integrates IMU measurements and stores preintegrated data
# for use in graph-based optimization, providing better fusion than simple averaging.
#
# Key Features:
# - Pure IMU integration for motion prediction
# - Stores preintegrated measurements for backend optimization
# - Enables tight coupling between IMU and visual constraints in graph optimization
# - Cleaner separation between prediction and optimization

type: IMUPreintegrationMotion
args:
  # Gravity constant (m/s^2) - adjust based on dataset location
  # Default: 9.81 (Earth standard gravity)
  gravity: 9.81
  
  # Device for computation ('cpu' or 'cuda' or 'cuda:0', etc.)
  device: cpu
