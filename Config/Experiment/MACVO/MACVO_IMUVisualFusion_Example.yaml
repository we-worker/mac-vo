# Example configuration for MAC-VO with IMU-Visual Fusion
# This configuration demonstrates how to use IMU data with stereo visual odometry
# 
# To use this configuration:
# python MACVO.py --odom Config/Experiment/MACVO/MACVO_IMUVisualFusion_Example.yaml --data Config/Sequence/EuRoC_MH01.yaml

Odometry:
  name: MACVO_IMU_Fusion
  
  # Use IMU-Visual Fusion motion model
  motion:
    !include Config/Module/MotionModel/IMUVisualFusion.yaml
  
  # Standard MACVO frontend configuration
  # Use FrontendCompose to combine depth and matching estimators
  frontend:
    type: FrontendCompose
    args:
      depth:
        type: PSMNetStereo
        args:
          device: cpu
          weight: "path/to/stereo/model.pth"
      
      match:
        type: PWCNetMatcher
        args:
          device: cpu
          weight: "path/to/pwcnet/model.pth"
  
  # Keypoint selection
  keypoint:
    type: DepthCovSelector
    args:
      edge_margin: 20
      depth_range: [0.1, 100.0]
  
  # Map point selection
  mappoint:
    type: RandomSelector
    args:
      edge_margin: 20
  
  # Outlier filtering
  outlier:
    type: NoneFilter
    args: {}
  
  # Observation covariance
  cov:
    obs:
      type: PixelCovProject
      args:
        baseline_scale: 1.0
  
  # Post-processing
  postprocess:
    type: NoneProcessor
    args: {}
  
  # Keyframe selection
  keyframe:
    type: MotionThresholdSelector
    args:
      translation_threshold: 0.1
      rotation_threshold: 0.05
  
  # Optimizer
  optimizer:
    type: ParallelTwoFramePGO
    args:
      device: cpu
      num_iterations: 10
  
  # System arguments
  args:
    device: cpu
    num_point: 500
    edgewidth: 20
    match_cov_default: 1.0
    profile: false
    mapping: true

# Preprocessing transformations
Preprocess:
  - type: Resize
    height: 480
    width: 640
  - type: Normalize
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
